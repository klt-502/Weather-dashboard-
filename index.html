<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#135f83"><title>Richmond • 14-day weather</title><style>body{margin:0;background:#eaf1f5;font-family:system-ui,-apple-system,sans-serif;color:#163447}header{background:#136588;color:white;padding:22px 20px}h1{font-size:24px;margin:0 0 5px}.sub{opacity:.9;font-size:13px}main{max-width:900px;margin:auto;padding:15px}.panel{background:white;border-radius:15px;padding:15px;box-shadow:0 2px 10px #1232}svg{width:100%;height:auto;display:block}.legend{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-top:12px}.hi{color:#d52323}.lo{color:#3534d8}button{background:#136588;color:white;border:0;border-radius:8px;padding:10px 15px;font-weight:600}footer{font-size:12px;color:#52616b;margin:15px 3px}#status{font-size:13px;color:#52616b;margin:8px 0 14px}</style></head><body><header><h1>14-day weather · Richmond</h1><div class="sub">Indiana · daily highs, lows & rain chances · °F</div></header><main><div class="panel"><div id="status">Loading forecast…</div><svg id="chart" viewBox="0 0 960 550" role="img" aria-label="14-day temperature forecast chart"></svg><div class="legend"><span class="hi">● High temperature</span><span class="lo">● Low temperature</span><button id="refresh">Refresh</button></div></div><footer>Forecast: Open-Meteo · Updates on opening and every 30 minutes while open. Long-range forecasts are less certain.</footer></main><script>
const svg=document.querySelector('#chart'),status=document.querySelector('#status');const ns='http://www.w3.org/2000/svg';function el(tag,attrs={},txt){const x=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,v));if(txt!==undefined)x.textContent=txt;svg.appendChild(x);return x}
async function load(){status.textContent='Updating forecast…';try{const u='https://api.open-meteo.com/v1/forecast?latitude=39.8289&longitude=-84.8902&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,weather_code&temperature_unit=fahrenheit&timezone=America%2FIndiana%2FIndianapolis&forecast_days=14';const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('Forecast service unavailable');const d=(await r.json()).daily;draw(d);status.textContent='Updated '+new Date().toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});}catch(e){status.textContent='Could not load forecast. Check your connection and tap Refresh.';}}
function draw(d){svg.replaceChildren();const W=960,H=550,left=38,right=28,top=75,bottom=165,n=d.time.length;const highs=d.temperature_2m_max.map(Math.round),lows=d.temperature_2m_min.map(Math.round);const low=Math.floor((Math.min(...lows)-7)/5)*5,high=Math.ceil((Math.max(...highs)+7)/5)*5;const x=i=>left+(W-left-right)*i/(n-1),y=t=>top+(high-t)*(H-top-bottom)/(high-low);d.time.forEach((day,i)=>{const date=new Date(day+'T12:00:00');if([0,6].includes(date.getDay()))el('rect',{x:x(i)-(i?28:0),y:30,width:i?56:35,height:H-75,fill:'#e8f3f5'});el('text',{x:x(i),y:48,'text-anchor':'middle',fill:'#34404a','font-size':22},date.toLocaleDateString('en-US',{weekday:'short'}));el('text',{x:x(i),y:69,'text-anchor':'middle',fill:'#667985','font-size':15},date.toLocaleDateString('en-US',{month:'numeric',day:'numeric'}));});for(const [vals,color,offset] of [[highs,'#db2626',-19],[lows,'#3436d9',29]]){el('polyline',{points:vals.map((v,i)=>`${x(i)},${y(v)}`).join(' '),fill:'none',stroke:color,'stroke-width':3,'stroke-linejoin':'round'});vals.forEach((v,i)=>{el('circle',{cx:x(i),cy:y(v),r:5.5,fill:color});el('text',{x:x(i),y:y(v)+offset,'text-anchor':'middle',fill:color,'font-size':22,'font-weight':600},String(v));});}const stripY=455, cell=(W-left-right)/n;el('text',{x:left,y:stripY-12,fill:'#4c6574','font-size':17},'PRECIPITATION CHANCE');d.time.forEach((day,i)=>{const prob=d.precipitation_probability_max?.[i];const amount=d.precipitation_sum?.[i];const pct=prob==null?null:Math.round(prob);const code=d.weather_code?.[i];const cloudy=code===3;const color=pct==null?'#e4e5e6':pct>=80?'#347fac':pct>=60?'#76bddf':pct>=40?'#b9e2ee':pct>=20?'#d5eaf0':cloudy?'#aeb8c1':'#f7df51';const xx=left+i*cell;const rect=el('rect',{x:xx+1,y:stripY,width:cell-2,height:42,fill:color,rx:3});const tooltip=document.createElementNS(ns,'title');tooltip.textContent=day+': '+(cloudy?'Overcast · ':'')+(pct==null?'Rain probability unavailable':pct+'% chance of precipitation')+(amount==null?'':' · '+amount+' mm forecast');rect.appendChild(tooltip);if(pct!=null&&pct>=20)el('text',{x:xx+cell/2,y:stripY+27,'text-anchor':'middle',fill:pct>=80?'#fff':'#214d66','font-size':17,'font-weight':600},pct+'%');});el('text',{x:left,y:stripY+67,fill:'#5d7380','font-size':16},'Yellow = dry/clear     Gray = cloudy/dry     Blue = rain chance');}
document.querySelector('#refresh').onclick=load;load();setInterval(load,30*60*1000);
</script></body></html>
